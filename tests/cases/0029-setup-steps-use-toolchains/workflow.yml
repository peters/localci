name: ci
on: [push, pull_request]
jobs:
  build:
    runs-on: localci-host
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20.11.1
      - uses: actions/setup-dotnet@v4
      - uses: actions/setup-node@v4
        if: ${{ github.event_name == 'release' }}
        with:
          node-version: 22.0.0
      - run: test "$LOCALCI_TOOLCHAINS" = "node 20.11.1"
  missing:
    runs-on: localci-host
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22.0.0
      - run: echo still runs
