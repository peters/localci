name: ci
on: [push, pull_request]
jobs:
  build:
    runs-on: localci-host
    steps:
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: |
          case "$GOROOT" in
            */0030-toolchains/go/1.22.5) ;;
            *) echo "GOROOT is $GOROOT"; exit 1 ;;
          esac
          test "$(go version)" = "go version go1.22.5 linux/amd64"
          test "$(dirname "$(command -v go)")" = "$GOROOT/bin"
          test "$LOCALCI_TOOLCHAIN_VERSIONS" = "go 1.22.5"
  remembered:
    runs-on: localci-host
    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: test "$LOCALCI_TOOLCHAIN_VERSIONS" = "go 1.22.5"
  missing:
    runs-on: localci-host
    steps:
      - uses: actions/setup-go@v5
        with:
          go-version: 1.23.4
      - run: echo still runs
