[package]
name = "localci"
version = "0.3.1"
edition = "2021"
# File::try_lock (the toolchains lock, ADR-0012) needs 1.89.
rust-version = "1.89"
description = "Run the GitHub Actions jobs that match this host, locally, so CI feedback does not wait on GitHub"
license = "MIT"
repository = "https://github.com/peters/localci"
readme = "README.md"
keywords = ["github-actions", "ci", "workflow", "local", "agent"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
# Verifies downloaded toolchains against the SHA-256 and SHA-512 sums of their official sources (ADR-0012).
sha2 = "0.11"

[profile.release]
strip = true
