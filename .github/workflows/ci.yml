name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Format
        shell: bash
        run: cargo fmt --check
      - name: Clippy
        shell: bash
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        shell: bash
        run: cargo test
